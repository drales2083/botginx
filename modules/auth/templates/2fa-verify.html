{{define "auth"}}
<!doctype html>
<html lang="{{currentLang}}" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <title>{{.Title}} | {{appName}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/adminlte.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 30, 46, 0.95);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .code-input {
            font-size: 2rem;
            letter-spacing: 0.5rem;
            text-align: center;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="auth-card p-4">
        <div class="text-center mb-4">
            <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width:80px;height:80px">
                <i class="bi bi-shield-lock fs-1 text-primary"></i>
            </div>
            <h4 class="mb-1">Two-Factor Authentication</h4>
            <p class="text-muted small">Enter the 6-digit code from your authenticator app</p>
        </div>

        <form id="verify-form">
            <div class="mb-4">
                <input type="text" class="form-control form-control-lg code-input"
                    id="code" name="code" placeholder="000000"
                    maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="verify-btn">
                <i class="bi bi-check-lg me-1"></i> Verify
            </button>

            <div class="text-center">
                <a href="#" class="text-muted small" data-bs-toggle="collapse" data-bs-target="#backup-section">
                    Use a backup code instead
                </a>
            </div>

            <div class="collapse mt-3" id="backup-section">
                <div class="input-group">
                    <input type="text" class="form-control" id="backup-code" placeholder="XXXX-XXXX">
                    <button type="button" class="btn btn-outline-secondary" id="backup-btn">Verify</button>
                </div>
            </div>
        </form>

        <hr class="my-4">

        <div class="text-center">
            <a href="/auth/login" class="text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Back to login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const pendingToken = sessionStorage.getItem('2fa_pending_token');
    if (!pendingToken) {
        window.location.href = '/auth/login';
    }

    document.getElementById('code').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        if (e.target.value.length === 6) {
            document.getElementById('verify-form').dispatchEvent(new Event('submit'));
        }
    });

    document.getElementById('verify-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = document.getElementById('code').value.trim();
        if (code.length !== 6) return;

        const btn = document.getElementById('verify-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Verifying...';

        try {
            const res = await fetch('/auth/api/2fa-verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pending_token: pendingToken,
                    code: code
                })
            });

            const data = await res.json();

            if (res.ok) {
                sessionStorage.removeItem('2fa_pending_token');
                window.location.href = '/user/dashboard';
            } else {
                document.getElementById('code').value = '';
                document.getElementById('code').focus();
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-lg me-1"></i> Verify';
                alert(data.error || 'Invalid code');
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-lg me-1"></i> Verify';
            alert('Network error');
        }
    });

    document.getElementById('backup-btn').addEventListener('click', async () => {
        const code = document.getElementById('backup-code').value.trim().toUpperCase();
        if (!code) return;

        const btn = document.getElementById('backup-btn');
        btn.disabled = true;

        try {
            const res = await fetch('/auth/api/2fa-verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pending_token: pendingToken,
                    backup_code: code
                })
            });

            const data = await res.json();

            if (res.ok) {
                sessionStorage.removeItem('2fa_pending_token');
                window.location.href = '/user/dashboard';
            } else {
                btn.disabled = false;
                alert(data.error || 'Invalid backup code');
            }
        } catch (err) {
            btn.disabled = false;
            alert('Network error');
        }
    });
    </script>
</body>
</html>
{{end}}
