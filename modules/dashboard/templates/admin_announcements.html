{{define "content"}}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">Announcements</h3>
        <div class="card-tools">
            <button type="button" class="btn btn-sm btn-primary" onclick="openModal()">
                <i class="bi bi-plus-lg me-1"></i>New Announcement
            </button>
        </div>
    </div>
    <div class="card-body">
        <table id="announcements-table" class="table table-striped">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Badge</th>
                    <th>Pinned</th>
                    <th>Published</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="announcementModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">New Announcement</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="announcement-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-id">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Body (HTML allowed)</label>
                        <textarea class="form-control" id="body" rows="6" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Badge (optional)</label>
                            <input type="text" class="form-control" id="badge" placeholder="e.g. NEW">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Options</label>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="is_pinned">
                                <label class="form-check-label" for="is_pinned">Pin to top</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let modal;
let table;

document.addEventListener('DOMContentLoaded', () => {
    modal = new bootstrap.Modal(document.getElementById('announcementModal'));
    loadAnnouncements();
});

async function loadAnnouncements() {
    const res = await fetch('/admin/announcements/api/list');
    const data = await res.json();

    const tbody = document.querySelector('#announcements-table tbody');
    tbody.innerHTML = data.map(a => `
        <tr>
            <td>${escapeHtml(a.title)}</td>
            <td>${a.badge ? `<span class="badge bg-danger">${escapeHtml(a.badge)}</span>` : '-'}</td>
            <td>${a.is_pinned ? '<i class="bi bi-pin-angle-fill text-warning"></i>' : '-'}</td>
            <td>${new Date(a.published_at).toLocaleDateString()}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary me-1" onclick='editAnnouncement(${JSON.stringify(a)})'>
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement('${a.id}')">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');

    if (typeof simpleDatatables !== 'undefined' && !table) {
        table = new simpleDatatables.DataTable('#announcements-table', {
            perPage: 10,
            searchable: true,
            sortable: true
        });
    }
}

function openModal(item = null) {
    document.getElementById('modalTitle').textContent = item ? 'Edit Announcement' : 'New Announcement';
    document.getElementById('edit-id').value = item?.id || '';
    document.getElementById('title').value = item?.title || '';
    document.getElementById('body').value = item?.body || '';
    document.getElementById('badge').value = item?.badge || '';
    document.getElementById('is_pinned').checked = item?.is_pinned || false;
    modal.show();
}

function editAnnouncement(item) {
    openModal(item);
}

async function deleteAnnouncement(id) {
    if (!confirm('Delete this announcement?')) return;

    const res = await fetch(`/admin/announcements/api/${id}`, { method: 'DELETE' });
    if (res.ok) {
        showToast('Announcement deleted', 'success');
        loadAnnouncements();
    } else {
        showToast('Failed to delete', 'danger');
    }
}

document.getElementById('announcement-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const id = document.getElementById('edit-id').value;
    const data = {
        title: document.getElementById('title').value,
        body: document.getElementById('body').value,
        badge: document.getElementById('badge').value || null,
        is_pinned: document.getElementById('is_pinned').checked
    };

    const url = id ? `/admin/announcements/api/${id}` : '/admin/announcements/api/create';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    if (res.ok) {
        modal.hide();
        showToast('Announcement saved', 'success');
        loadAnnouncements();
    } else {
        showToast('Failed to save', 'danger');
    }
});

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{{end}}
