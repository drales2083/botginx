{{define "content"}}
<style>
/* Modern Wizard Steps */
.wizard-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 1.5rem 1rem;
    background: var(--bs-tertiary-bg);
    border-radius: var(--bs-border-radius-lg);
    margin-bottom: 1.5rem;
}
.wizard-step {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}
.wizard-step-number {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    background: var(--bs-body-bg);
    border: 2px solid var(--bs-border-color);
    color: var(--bs-secondary-color);
    transition: all 0.2s ease;
}
.wizard-step-text {
    font-weight: 500;
    color: var(--bs-secondary-color);
    transition: color 0.2s ease;
}
.wizard-step.active .wizard-step-number {
    background: var(--bs-primary);
    border-color: var(--bs-primary);
    color: #fff;
    box-shadow: 0 0 0 4px rgba(var(--bs-primary-rgb), 0.2);
}
.wizard-step.active .wizard-step-text {
    color: var(--bs-emphasis-color);
    font-weight: 600;
}
.wizard-step.completed .wizard-step-number {
    background: var(--bs-success);
    border-color: var(--bs-success);
    color: #fff;
}
.wizard-step.completed .wizard-step-number::after {
    content: '\f633';
    font-family: 'bootstrap-icons';
}
.wizard-step.completed .wizard-step-number span {
    display: none;
}
.wizard-connector {
    flex: 1;
    height: 2px;
    background: var(--bs-border-color);
    margin: 0 1rem;
    max-width: 100px;
    transition: background 0.2s ease;
}
.wizard-connector.completed {
    background: var(--bs-success);
}
@media (max-width: 575.98px) {
    .wizard-step-text { display: none; }
    .wizard-connector { max-width: 2rem; margin: 0 0.5rem; }
}
</style>

<div class="card card-primary card-outline">
    <div class="card-header">
        <h3 class="card-title"><i class="bi bi-magic me-2"></i>{{t "wizard.link_wizard"}}</h3>
    </div>
    <div class="card-body">
        <!-- Wizard Steps -->
        <div class="wizard-container" id="wizard-steps">
            <div class="wizard-step active" data-step="0">
                <div class="wizard-step-number"><span>1</span></div>
                <div class="wizard-step-text">{{t "wizard.link_details"}}</div>
            </div>
            <div class="wizard-connector"></div>
            <div class="wizard-step" data-step="1">
                <div class="wizard-step-number"><span>2</span></div>
                <div class="wizard-step-text">{{t "wizard.bot_protection"}}</div>
            </div>
        </div>

        <!-- Step 1: Link Details -->
        <div id="step-1">
            <div id="error-alert" class="alert alert-danger d-none"></div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="domainId" class="form-label">{{t "wizard.domain"}}</label>
                    <select class="form-select" id="domainId" name="domainId" required>
                        <option value="">{{t "form.select_domain"}}</option>
                        {{range .Domains}}
                        {{if and .DNSVerified .SSLEnabled}}
                        <option value="{{.ID}}">{{.Name}}{{if .IsShared}} ({{t "form.shared"}}){{end}}</option>
                        {{end}}
                        {{end}}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="subdomain" class="form-label">{{t "wizard.subdomain"}}</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="subdomain" name="subdomain"
                               value="{{.SuggestedSubdomain}}" placeholder="amber-canyon" required>
                        <button type="button" class="btn btn-outline-secondary" id="btn-random-subdomain" title="{{t "form.random_subdomain"}}">
                            <i class="bi bi-shuffle"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="path" class="form-label">{{t "wizard.path"}}</label>
                <div class="btn-group mb-2 w-100" role="group">
                    <input type="radio" class="btn-check" name="pathStyle" id="pathStyleTracking" value="tracking" checked>
                    <label class="btn btn-outline-secondary" for="pathStyleTracking">
                        <i class="bi bi-shield-lock me-1"></i>{{t "form.advanced"}}
                    </label>
                    <input type="radio" class="btn-check" name="pathStyle" id="pathStyleSimple" value="simple">
                    <label class="btn btn-outline-secondary" for="pathStyleSimple">
                        <i class="bi bi-link-45deg me-1"></i>{{t "form.simple"}}
                    </label>
                </div>
                <div class="input-group">
                    <span class="input-group-text">/</span>
                    <input type="text" class="form-control" id="path" name="path"
                           value="{{.SuggestedPath}}" placeholder="redirect" required>
                    <button type="button" class="btn btn-outline-secondary" id="btn-random-path" title="{{t "form.random_subdomain"}}">
                        <i class="bi bi-shuffle"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">{{t "wizard.destinations"}}</label>
                <div id="urls-container">
                    <div class="input-group mb-2">
                        <input type="url" class="form-control url-input" placeholder="https://example.com" required>
                        <button type="button" class="btn btn-outline-secondary btn-add-url">
                            <i class="bi bi-plus"></i>
                        </button>
                    </div>
                </div>
                <small class="text-muted">{{t "form.add_multiple_urls"}}</small>
            </div>

            <div class="mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="passParams" name="passParams" checked>
                    <label class="form-check-label" for="passParams">
                        {{t "form.pass_params"}}
                    </label>
                </div>
            </div>

            <hr>
            <div class="d-flex justify-content-between">
                <a href="/user/redirectlinks" class="btn btn-secondary">{{t "cancel"}}</a>
                <button type="button" class="btn btn-primary" id="btn-next">
                    {{t "wizard.next"}}<i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>
        </div>

        <!-- Step 2: Bot Protection -->
        <div id="step-2" class="d-none">
            {{template "protection-settings" .}}

            <hr>
            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-secondary" id="btn-back">
                    <i class="bi bi-arrow-left me-1"></i>{{t "wizard.previous"}}
                </button>
                <button type="button" class="btn btn-success" id="btn-create">
                    <i class="bi bi-check-lg me-1"></i>{{t "wizard.create_link"}}
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Wizard state
let currentStep = 1;
let linkData = {};

// Step navigation
function showStep(step) {
    currentStep = step;
    document.getElementById('step-1').classList.toggle('d-none', step !== 1);
    document.getElementById('step-2').classList.toggle('d-none', step !== 2);

    const steps = document.querySelectorAll('.wizard-step');
    const connectors = document.querySelectorAll('.wizard-connector');
    steps.forEach((el, i) => {
        el.classList.remove('active', 'completed');
        if (i < step - 1) el.classList.add('completed');
        if (i === step - 1) el.classList.add('active');
    });
    connectors.forEach((el, i) => {
        el.classList.toggle('completed', i < step - 1);
    });
}

// Next button
document.getElementById('btn-next').addEventListener('click', () => {
    const domainId = document.getElementById('domainId').value;
    const subdomain = document.getElementById('subdomain').value.trim();
    const path = document.getElementById('path').value.trim();
    const urls = Array.from(document.querySelectorAll('.url-input'))
        .map(i => i.value.trim())
        .filter(u => u);
    const passParams = document.getElementById('passParams').checked;

    if (!domainId) {
        showToast('{{t "wizard.select_domain"}}', 'warning');
        return;
    }
    if (!subdomain) {
        showToast('{{t "wizard.enter_subdomain"}}', 'warning');
        return;
    }
    if (!path) {
        showToast('{{t "wizard.enter_path"}}', 'warning');
        return;
    }
    if (urls.length === 0) {
        showToast('{{t "wizard.enter_url"}}', 'warning');
        return;
    }

    linkData = { domainId, subdomain, path, urls, passParams, type: 'REDIRECT' };
    showStep(2);
});

// Back button
document.getElementById('btn-back').addEventListener('click', () => showStep(1));

// Create button
document.getElementById('btn-create').addEventListener('click', async () => {
    const btn = document.getElementById('btn-create');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>{{t "wizard.creating"}}';

    try {
        const protSettings = window.protectionSettings ? window.protectionSettings.getSettings() : {};

        const linkRes = await fetch('/user/redirectlinks/api/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(linkData)
        });

        const linkResult = await linkRes.json();
        if (!linkRes.ok) {
            showToast(linkResult.error || '{{t "wizard.create_failed"}}', 'danger');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>{{t "wizard.create_link"}}';
            return;
        }

        const linkId = linkResult.link.id;

        const settingsRes = await fetch(`/user/analytics/api/link/${linkId}/settings`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(protSettings)
        });

        if (settingsRes.ok) {
            showToast('{{t "wizard.link_created"}}', 'success');
        } else {
            showToast('{{t "wizard.link_created"}}', 'warning');
        }
        setTimeout(() => window.location.href = `/user/redirectlinks/${linkId}`, 500);
    } catch (err) {
        showToast('{{t "wizard.create_failed"}}', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>{{t "wizard.create_link"}}';
    }
});

// Random subdomain
document.getElementById('btn-random-subdomain').addEventListener('click', async () => {
    const res = await fetch('/user/redirectlinks/api/random-subdomain');
    const data = await res.json();
    if (data.subdomain) document.getElementById('subdomain').value = data.subdomain;
});

// Random path
document.getElementById('btn-random-path').addEventListener('click', async () => {
    const style = document.querySelector('input[name="pathStyle"]:checked').value;
    const endpoint = style === 'tracking'
        ? '/user/redirectlinks/api/random-tracking-path'
        : '/user/redirectlinks/api/random-path';
    const res = await fetch(endpoint);
    const data = await res.json();
    if (data.path) document.getElementById('path').value = data.path;
});

// Path style change
document.querySelectorAll('input[name="pathStyle"]').forEach(radio => {
    radio.addEventListener('change', async () => {
        const style = document.querySelector('input[name="pathStyle"]:checked').value;
        const endpoint = style === 'tracking'
            ? '/user/redirectlinks/api/random-tracking-path'
            : '/user/redirectlinks/api/random-path';
        const res = await fetch(endpoint);
        const data = await res.json();
        if (data.path) document.getElementById('path').value = data.path;
    });
});

// Add URL button
document.querySelector('.btn-add-url').addEventListener('click', function() {
    const container = document.getElementById('urls-container');
    const div = document.createElement('div');
    div.className = 'input-group mb-2';
    div.innerHTML = `
        <input type="url" class="form-control url-input" placeholder="https://example.com">
        <button type="button" class="btn btn-outline-danger btn-remove-url"><i class="bi bi-trash"></i></button>
    `;
    container.appendChild(div);
    div.querySelector('.btn-remove-url').addEventListener('click', () => div.remove());
});

// Initialize protection settings
document.addEventListener('DOMContentLoaded', () => {
    if (window.protectionSettings) window.protectionSettings.init({});
});
</script>
{{end}}
