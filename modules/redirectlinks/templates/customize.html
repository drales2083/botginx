{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <a href="/user/redirectlinks/{{.Link.ID}}" class="text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>Back to link
        </a>
    </div>
    <span class="badge bg-secondary">{{.Link.Subdomain}}.{{.Link.BaseDomain}}</span>
</div>

{{template "customizer" .}}

<script>
// Initialize customizer with link data
document.addEventListener('DOMContentLoaded', function() {
    const existing = {{if .Link.Customization}}{{.Link.Customization | json}}{{else}}{}{{end}};
    const previewUrl = '/user/redirectlinks/api/customizer/preview';
    const saveUrl = '/user/redirectlinks/api/{{.Link.ID}}/customization';

    initCustomizer(existing, previewUrl, saveUrl);
});
</script>
{{end}}
