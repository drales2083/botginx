{{define "content"}}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/user/support">{{t "support"}}</a></li>
                    <li class="breadcrumb-item active">{{t "support.new_ticket"}}</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0"><i class="bi bi-headset me-2"></i>{{t "support.submit_ticket"}}</h5>
                </div>
                <div class="card-body">
                    <form id="ticketForm">
                        <div class="mb-3">
                            <label class="form-label">{{t "support.category"}} <span class="text-danger">*</span></label>
                            <select class="form-select" name="category" required>
                                <option value="">{{t "support.select_category"}}</option>
                                {{range .Categories}}
                                <option value="{{.}}">{{.}}</option>
                                {{end}}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{t "support.subject"}} <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="subject"
                                   placeholder="{{t "support.describe_issue"}}"
                                   required minlength="5" maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{t "support.message"}} <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="message" rows="6"
                                      placeholder="{{t "support.describe_issue"}}"
                                      required minlength="10" maxlength="2000"></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/user/support" class="btn btn-secondary">{{t "cancel"}}</a>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="bi bi-send me-1"></i>{{t "support.submit_ticket"}}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('ticketForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>{{t "form.submitting"}}';

    const formData = new FormData(this);
    const data = {
        category: formData.get('category'),
        subject: formData.get('subject'),
        message: formData.get('message')
    };

    try {
        const response = await fetch('/user/support/api', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok && result.success) {
            window.showToast?.('{{t "success"}}', 'success');
            window.location.href = result.redirect;
        } else {
            window.showToast?.(result.error || '{{t "error"}}', 'danger');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    } catch (err) {
        window.showToast?.('{{t "network_error"}}', 'danger');
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
});
</script>
{{end}}
