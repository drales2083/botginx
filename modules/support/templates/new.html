{{define "content"}}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/user/support">Support</a></li>
                    <li class="breadcrumb-item active">New Ticket</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0"><i class="bi bi-headset me-2"></i>Create Support Ticket</h5>
                </div>
                <div class="card-body">
                    <form id="ticketForm">
                        <div class="mb-3">
                            <label class="form-label">Category <span class="text-danger">*</span></label>
                            <select class="form-select" name="category" required>
                                <option value="">Choose what your ticket is about...</option>
                                {{range .Categories}}
                                <option value="{{.}}">{{.}}</option>
                                {{end}}
                            </select>
                            <small class="text-muted">Helps us route your ticket to the right team faster.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="subject"
                                   placeholder="Brief description (5-100 chars)"
                                   required minlength="5" maxlength="100">
                            <small class="text-muted">5-100 characters</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="message" rows="6"
                                      placeholder="Describe your issue (10-2000 chars)..."
                                      required minlength="10" maxlength="2000"></textarea>
                            <small class="text-muted">10-2000 characters. For images, upload to <a href="https://prnt.sc/" target="_blank">prnt.sc</a> and paste the link.</small>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/user/support" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="bi bi-send me-1"></i>Submit Ticket
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('ticketForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Submitting...';

    const formData = new FormData(this);
    const data = {
        category: formData.get('category'),
        subject: formData.get('subject'),
        message: formData.get('message')
    };

    try {
        const response = await fetch('/user/support/api', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok && result.success) {
            window.showToast?.('Ticket created successfully', 'success');
            window.location.href = result.redirect;
        } else {
            window.showToast?.(result.error || 'Failed to create ticket', 'danger');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    } catch (err) {
        window.showToast?.('Network error', 'danger');
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
});
</script>
{{end}}
