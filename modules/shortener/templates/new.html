{{define "content"}}
<div class="mb-3">
    <a href="/user/shortener" class="text-muted text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i>{{t "shortener.back_to_links"}}
    </a>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-link-45deg me-2"></i>{{t "shortener.create_short_link"}}</h5>
    </div>
    <div class="card-body">
        <form id="create-form">
            <div class="row g-3">
                <!-- Domain -->
                <div class="col-md-3">
                    <label class="form-label">{{t "shortener.domain"}}</label>
                    <select class="form-select" id="domainId" required>
                        <option value="">{{t "form.select_domain"}}</option>
                        {{/* Active domains first */}}
                        {{range .Domains}}
                        {{if and .DNSVerified .SSLEnabled}}
                        <option value="{{.ID}}">{{.Name}}{{if .IsShared}} ({{t "form.shared"}}){{end}}</option>
                        {{end}}
                        {{end}}
                        {{/* Inactive own domains below (shared domains hidden if not ready) */}}
                        {{range .Domains}}
                        {{if and (not (and .DNSVerified .SSLEnabled)) (not .IsShared)}}
                        {{if not .DNSVerified}}
                        <option value="" disabled class="text-muted">{{.Name}} ({{t "form.dns_pending"}})</option>
                        {{else}}
                        <option value="" disabled class="text-muted">{{.Name}} ({{t "form.no_ssl"}})</option>
                        {{end}}
                        {{end}}
                        {{end}}
                    </select>
                </div>

                <!-- Subdomain -->
                <div class="col-md-3">
                    <label class="form-label">{{t "shortener.subdomain"}}</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="subdomain" pattern="[a-z0-9]+" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="randomizeSubdomain()" title="{{t "shortener.generate_random"}}">
                            <i class="bi bi-shuffle"></i>
                        </button>
                    </div>
                </div>

                <!-- Path -->
                <div class="col-md-4">
                    <label class="form-label">{{t "shortener.path"}}</label>
                    <div class="input-group">
                        <span class="input-group-text">/</span>
                        <input type="text" class="form-control" id="path" pattern="[a-zA-Z0-9\-_]+" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="randomizePath()" title="{{t "shortener.generate_random"}}">
                            <i class="bi bi-shuffle"></i>
                        </button>
                    </div>
                </div>

                <!-- QR -->
                <div class="col-md-2">
                    <label class="form-label">{{t "shortener.qr_code"}}</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="qrEnabled">
                        <label class="form-check-label" for="qrEnabled">{{t "shortener.enable"}}</label>
                    </div>
                </div>
            </div>

            <!-- Destinations -->
            <div class="mt-4">
                <label class="form-label">{{t "shortener.destination_urls"}}</label>
                <div id="destinations-container">
                    <div class="input-group mb-2">
                        <input type="url" class="form-control destination-input" placeholder="https://example.com" required>
                        <button type="button" class="btn btn-outline-success" onclick="addDestination()">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                    </div>
                </div>
                <small class="text-muted">{{t "shortener.multiple_urls_hint"}}</small>
            </div>

            <!-- Protection Settings (collapsible) -->
            <div class="mt-4">
                <div class="card border">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center"
                         style="cursor: pointer;"
                         data-bs-toggle="collapse"
                         data-bs-target="#protection-collapse">
                        <span><i class="bi bi-shield-check me-2"></i>{{t "shortener.protection_settings"}}</span>
                        <i class="bi bi-chevron-down" id="protection-chevron"></i>
                    </div>
                    <div class="collapse" id="protection-collapse">
                        <div class="card-body">
                            {{template "protection-settings" .}}
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    <i class="bi bi-check-lg me-1"></i>{{t "shortener.create_short_link"}}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const TRANSLATIONS = {
    creating: '{{t "shortener.creating"}}',
    created: '{{t "shortener.created"}}',
    createFailed: '{{t "shortener.create_failed"}}',
    destRequired: '{{t "shortener.dest_required"}}'
};

document.addEventListener('DOMContentLoaded', () => {
    randomizeSubdomain();
    randomizePath();

    const defaults = {{json .DefaultProtection}};
    if (window.protectionSettings) {
        window.protectionSettings.init(defaults);
    }

    document.getElementById('protection-collapse').addEventListener('show.bs.collapse', () => {
        document.getElementById('protection-chevron').classList.replace('bi-chevron-down', 'bi-chevron-up');
    });
    document.getElementById('protection-collapse').addEventListener('hide.bs.collapse', () => {
        document.getElementById('protection-chevron').classList.replace('bi-chevron-up', 'bi-chevron-down');
    });
});

async function randomizeSubdomain() {
    const res = await fetch('/user/shortener/api/random-subdomain');
    const data = await res.json();
    document.getElementById('subdomain').value = data.subdomain;
}

async function randomizePath() {
    const res = await fetch('/user/shortener/api/random-path');
    const data = await res.json();
    document.getElementById('path').value = data.path;
}

function addDestination() {
    const container = document.getElementById('destinations-container');
    const div = document.createElement('div');
    div.className = 'input-group mb-2';
    div.innerHTML = `
        <input type="url" class="form-control destination-input" placeholder="https://example.com">
        <button type="button" class="btn btn-outline-danger" onclick="this.parentElement.remove()">
            <i class="bi bi-trash"></i>
        </button>
    `;
    container.appendChild(div);
}

document.getElementById('create-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submit-btn');
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' + TRANSLATIONS.creating;

    try {
        const destinations = Array.from(document.querySelectorAll('.destination-input'))
            .map(i => i.value.trim())
            .filter(v => v);

        if (destinations.length === 0) {
            showToast(TRANSLATIONS.destRequired, 'warning');
            btn.disabled = false;
            btn.innerHTML = originalHtml;
            return;
        }

        const data = {
            domainId: document.getElementById('domainId').value,
            subdomain: document.getElementById('subdomain').value.toLowerCase(),
            path: document.getElementById('path').value,
            destinations: destinations,
            rotationMode: 'random',
            qrEnabled: document.getElementById('qrEnabled').checked,
            protectionSettings: window.protectionSettings ? window.protectionSettings.getSettings() : {}
        };

        const res = await fetch('/user/shortener/api/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            const link = await res.json();
            showToast(TRANSLATIONS.created, 'success');
            window.location.href = '/user/shortener/' + link.id;
        } else {
            const err = await res.json();
            showToast(err.error || TRANSLATIONS.createFailed, 'danger');
        }
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    }
});
</script>
{{end}}
