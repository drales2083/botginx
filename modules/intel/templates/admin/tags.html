{{define "content"}}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="card-title mb-0"><i class="bi bi-tags me-2"></i>Tags</h3>
                <div>
                    <a href="/admin/intel" class="btn btn-outline-secondary btn-sm me-2">
                        <i class="bi bi-arrow-left me-1"></i>Back to Articles
                    </a>
                    <button type="button" class="btn btn-primary btn-sm" onclick="showAddModal()">
                        <i class="bi bi-plus-lg me-1"></i>Add Tag
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Slug</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{range .Tags}}
                            <tr>
                                <td><span class="badge bg-secondary">{{.Name}}</span></td>
                                <td><code>{{.Slug}}</code></td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-outline-danger btn-sm"
                                            onclick="deleteTag('{{.ID}}', '{{.Name}}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            {{else}}
                            <tr>
                                <td colspan="3" class="text-center text-muted py-4">No tags yet</td>
                            </tr>
                            {{end}}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="tag-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Tag</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-0">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="tag-name" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveTag()">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
let tagModal;

document.addEventListener('DOMContentLoaded', function() {
    tagModal = new bootstrap.Modal(document.getElementById('tag-modal'));
});

function showAddModal() {
    document.getElementById('tag-name').value = '';
    tagModal.show();
}

async function saveTag() {
    const name = document.getElementById('tag-name').value.trim();
    if (!name) {
        showToast('Name is required', 'warning');
        return;
    }

    try {
        const res = await fetch('/admin/intel/api/tags', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        const data = await res.json();

        if (data.success) {
            tagModal.hide();
            flashToast('Tag created!', 'success');
            window.location.reload();
        } else {
            showToast(data.error || 'Save failed', 'danger');
        }
    } catch (err) {
        showToast('Network error', 'danger');
    }
}

async function deleteTag(id, name) {
    if (!confirm(`Delete tag "${name}"?`)) return;

    try {
        const res = await fetch(`/admin/intel/api/tags/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            flashToast('Tag deleted', 'success');
            window.location.reload();
        } else {
            showToast(data.error || 'Delete failed', 'danger');
        }
    } catch (err) {
        showToast('Network error', 'danger');
    }
}
</script>
{{end}}
