{{define "content"}}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="card-title mb-0"><i class="bi bi-folder me-2"></i>Categories</h3>
                <div>
                    <a href="/admin/intel" class="btn btn-outline-secondary btn-sm me-2">
                        <i class="bi bi-arrow-left me-1"></i>Back to Articles
                    </a>
                    <button type="button" class="btn btn-primary btn-sm" onclick="showAddModal()">
                        <i class="bi bi-plus-lg me-1"></i>Add Category
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Slug</th>
                                <th>Description</th>
                                <th>Order</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{range .Categories}}
                            <tr>
                                <td><strong>{{.Name}}</strong></td>
                                <td><code>{{.Slug}}</code></td>
                                <td>{{.Description}}</td>
                                <td>{{.SortOrder}}</td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <button type="button" class="btn btn-outline-primary"
                                                onclick="editCategory('{{.ID}}', '{{.Name}}', '{{.Description}}', {{.SortOrder}})">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-danger"
                                                onclick="deleteCategory('{{.ID}}', '{{.Name}}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            {{else}}
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">No categories yet</td>
                            </tr>
                            {{end}}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="category-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Add Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="category-id">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="category-name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" id="category-description" rows="2"></textarea>
                </div>
                <div class="mb-0">
                    <label class="form-label">Sort Order</label>
                    <input type="number" class="form-control" id="category-order" value="0">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveCategory()">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
let categoryModal;

document.addEventListener('DOMContentLoaded', function() {
    categoryModal = new bootstrap.Modal(document.getElementById('category-modal'));
});

function showAddModal() {
    document.getElementById('modal-title').textContent = 'Add Category';
    document.getElementById('category-id').value = '';
    document.getElementById('category-name').value = '';
    document.getElementById('category-description').value = '';
    document.getElementById('category-order').value = '0';
    categoryModal.show();
}

function editCategory(id, name, description, order) {
    document.getElementById('modal-title').textContent = 'Edit Category';
    document.getElementById('category-id').value = id;
    document.getElementById('category-name').value = name;
    document.getElementById('category-description').value = description;
    document.getElementById('category-order').value = order;
    categoryModal.show();
}

async function saveCategory() {
    const id = document.getElementById('category-id').value;
    const payload = {
        name: document.getElementById('category-name').value,
        description: document.getElementById('category-description').value,
        sortOrder: parseInt(document.getElementById('category-order').value) || 0
    };

    const method = id ? 'PUT' : 'POST';
    const url = id ? `/admin/intel/api/categories/${id}` : '/admin/intel/api/categories';

    try {
        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
            categoryModal.hide();
            flashToast('Category saved!', 'success');
            window.location.reload();
        } else {
            showToast(data.error || 'Save failed', 'danger');
        }
    } catch (err) {
        showToast('Network error', 'danger');
    }
}

async function deleteCategory(id, name) {
    if (!confirm(`Delete category "${name}"? Articles in this category will become uncategorized.`)) return;

    try {
        const res = await fetch(`/admin/intel/api/categories/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            flashToast('Category deleted', 'success');
            window.location.reload();
        } else {
            showToast(data.error || 'Delete failed', 'danger');
        }
    } catch (err) {
        showToast('Network error', 'danger');
    }
}
</script>
{{end}}
