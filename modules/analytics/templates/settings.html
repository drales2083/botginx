{{define "content"}}
<div class="row mb-3">
    <div class="col">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/user/redirectlinks">Links</a></li>
                <li class="breadcrumb-item"><a href="/user/analytics/link/{{.LinkID}}">Analytics</a></li>
                <li class="breadcrumb-item active">Traffic Settings</li>
            </ol>
        </nav>
    </div>
    {{if .LinkURL}}
    <div class="col-auto">
        <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-secondary" onclick="copyLinkURL()" title="Copy link URL">
                <i class="bi bi-clipboard me-1"></i>Copy URL
            </button>
            <a href="{{.LinkURL}}" target="_blank" class="btn btn-outline-secondary" title="Open in new tab">
                <i class="bi bi-box-arrow-up-right me-1"></i>Open
            </a>
        </div>
    </div>
    {{end}}
</div>

<div class="card">
    <div class="card-body">
        {{template "protection-settings" .}}

        <hr class="my-4">
        <div class="d-flex justify-content-between">
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary" id="save-btn">
                    <i class="bi bi-check-lg me-1"></i>Save Settings
                </button>
                <a href="/user/analytics/link/{{.LinkID}}" class="btn btn-secondary">Cancel</a>
            </div>
            <button type="button" class="btn btn-outline-danger" id="delete-btn">
                <i class="bi bi-trash me-1"></i>Delete Link
            </button>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-danger">
                <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Delete Link</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this link?</p>
                <p class="text-muted small mb-0">This will remove all deployed files and cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="bi bi-trash me-1"></i>Delete Permanently
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Copy link URL
function copyLinkURL() {
    const url = '{{.LinkURL}}';
    navigator.clipboard.writeText(url).then(() => {
        showToast('URL copied to clipboard', 'success');
    }).catch(() => {
        showToast('Failed to copy URL', 'danger');
    });
}

// Delete modal
let deleteModal = null;
document.addEventListener('DOMContentLoaded', () => {
    deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
});

// Show delete modal
document.getElementById('delete-btn').addEventListener('click', () => {
    deleteModal.show();
});

// Confirm delete
document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
    const btn = document.getElementById('confirmDeleteBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Deleting...';

    try {
        // Determine API endpoint based on link type
        const linkType = '{{.LinkType}}';
        let apiUrl;
        let redirectUrl;
        if (linkType === 'shortener') {
            apiUrl = '/user/shortener/api/{{.LinkID}}';
            redirectUrl = '/user/shortener';
        } else {
            apiUrl = '/user/redirectlinks/api/{{.LinkID}}';
            redirectUrl = '/user/redirectlinks';
        }

        const res = await fetch(apiUrl, { method: 'DELETE' });

        if (res.ok) {
            showToast('Link deleted successfully', 'success');
            setTimeout(() => window.location.href = redirectUrl, 500);
        } else {
            const d = await res.json().catch(() => ({}));
            showToast(d.error || 'Failed to delete link', 'danger');
            deleteModal.hide();
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-trash me-1"></i>Delete Permanently';
        }
    } catch (err) {
        showToast('Error deleting link', 'danger');
        deleteModal.hide();
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-trash me-1"></i>Delete Permanently';
    }
});

// Initialize protection settings with existing data
document.addEventListener('DOMContentLoaded', () => {
    const settings = {{json .Settings}};
    if (window.protectionSettings) {
        window.protectionSettings.init(settings);
    }
});

// Save
document.getElementById('save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';

    try {
        const data = window.protectionSettings.getSettings();

        const res = await fetch('/user/analytics/api/link/{{.LinkID}}/settings', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            showToast('Settings saved', 'success');
        } else {
            const d = await res.json().catch(() => ({}));
            showToast(d.error || 'Failed to save settings', 'danger');
        }
    } catch (err) {
        showToast('Error saving settings', 'danger');
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Save Settings';
});

// Tab persistence via URL hash
document.querySelectorAll('.prot-tabs .nav-link').forEach(tab => {
    tab.addEventListener('shown.bs.tab', function(e) {
        const hash = e.target.getAttribute('href');
        history.replaceState(null, null, hash);
    });
});

// Restore active tab from hash on page load
document.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash;
    if (hash) {
        const tab = document.querySelector(`.prot-tabs .nav-link[href="${hash}"]`);
        if (tab) {
            const bsTab = new bootstrap.Tab(tab);
            bsTab.show();
        }
    }
});
</script>
{{end}}
