{{define "content"}}
<div class="row">
    <div class="col-md-3">
        {{template "hosting_user_nav" .}}
    </div>
    <div class="col-md-9">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h4 class="mb-0"><i class="bi bi-shield-check me-2"></i>Protection Settings</h4>
            <span class="badge bg-primary">{{.Domain.Domain}}</span>
        </div>

        <div class="card">
            <div class="card-body">
                {{template "protection-settings" .}}

                <hr class="my-4">
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary" id="save-btn">
                        <i class="bi bi-check-lg me-1"></i>Save Settings
                    </button>
                    <a href="/user/hosting/{{.Account.ID}}/domains/{{.Domain.ID}}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const accountID = '{{.Account.ID}}';
const domainID = '{{.Domain.ID}}';

// Initialize protection settings with existing data
document.addEventListener('DOMContentLoaded', () => {
    const settings = {{json .Settings}};
    if (window.protectionSettings) {
        window.protectionSettings.init(settings);
    }
});

// Save
document.getElementById('save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';

    try {
        const data = window.protectionSettings.getSettings();

        const res = await fetch(`/user/hosting/api/${accountID}/domains/${domainID}/settings`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            showToast('Settings saved', 'success');
        } else {
            const d = await res.json().catch(() => ({}));
            showToast(d.error || 'Failed to save settings', 'danger');
        }
    } catch (err) {
        showToast('Error saving settings', 'danger');
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Save Settings';
});

// Tab persistence via URL hash
document.querySelectorAll('.prot-tabs .nav-link').forEach(tab => {
    tab.addEventListener('shown.bs.tab', function(e) {
        const hash = e.target.getAttribute('href');
        history.replaceState(null, null, hash);
    });
});

// Restore active tab from hash on page load
document.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash;
    if (hash) {
        const tab = document.querySelector(`.prot-tabs .nav-link[href="${hash}"]`);
        if (tab) {
            const bsTab = new bootstrap.Tab(tab);
            bsTab.show();
        }
    }
});
</script>
{{end}}
