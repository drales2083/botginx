{{define "hosting_user_nav"}}
<div class="card">
    <div class="list-group list-group-flush">
        <a href="/user/hosting/{{.Account.ID}}"
           class="list-group-item list-group-item-action {{if eq .NavActive "overview"}}active{{end}}">
            <i class="bi bi-speedometer2 me-2"></i>Overview
        </a>
        {{if ne .Account.Status "pending"}}
        <a href="/user/hosting/{{.Account.ID}}/domains"
           class="list-group-item list-group-item-action {{if eq .NavActive "domains"}}active{{end}}">
            <i class="bi bi-shield-check me-2"></i>Domain Protection
        </a>
        {{end}}
    </div>
</div>
<div class="mt-3">
    <a href="/user/hosting" class="btn btn-outline-secondary btn-sm w-100">
        <i class="bi bi-arrow-left me-1"></i>All Accounts
    </a>
</div>
{{end}}
