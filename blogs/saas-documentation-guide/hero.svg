<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#1a1d21"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Open book icon -->
  <g transform="translate(480, 160)">
    <!-- Left page -->
    <path d="M120 0 L120 160 Q60 150 0 160 L0 20 Q60 10 120 0 Z" fill="url(#book)" opacity="0.9"/>
    <!-- Right page -->
    <path d="M120 0 L120 160 Q180 150 240 160 L240 20 Q180 10 120 0 Z" fill="url(#book)" opacity="0.8"/>
    <!-- Page lines (left) -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="1">
      <line x1="20" y1="40" x2="100" y2="35"/>
      <line x1="20" y1="60" x2="100" y2="55"/>
      <line x1="20" y1="80" x2="100" y2="75"/>
      <line x1="20" y1="100" x2="80" y2="95"/>
      <line x1="20" y1="120" x2="100" y2="115"/>
    </g>
    <!-- Page lines (right) -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="1">
      <line x1="140" y1="35" x2="220" y2="40"/>
      <line x1="140" y1="55" x2="220" y2="60"/>
      <line x1="140" y1="75" x2="220" y2="80"/>
      <line x1="140" y1="95" x2="200" y2="100"/>
      <line x1="140" y1="115" x2="220" y2="120"/>
    </g>
    <!-- Spine -->
    <line x1="120" y1="0" x2="120" y2="160" stroke="rgba(0,0,0,0.3)" stroke-width="3"/>
  </g>

  <!-- Floating UI cards -->
  <g transform="translate(200, 180)" opacity="0.7">
    <rect x="0" y="0" width="100" height="70" rx="8" fill="url(#card)" stroke="url(#accent)" stroke-width="1"/>
    <rect x="10" y="15" width="60" height="6" rx="3" fill="#14b8a6" opacity="0.6"/>
    <rect x="10" y="28" width="80" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="10" y="38" width="70" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="10" y="48" width="50" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  </g>
  <g transform="translate(900, 200)" opacity="0.6">
    <rect x="0" y="0" width="90" height="60" rx="6" fill="url(#card)" stroke="url(#accent)" stroke-width="1"/>
    <rect x="8" y="12" width="50" height="5" rx="2.5" fill="#14b8a6" opacity="0.6"/>
    <rect x="8" y="24" width="70" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="8" y="32" width="60" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="8" y="40" width="40" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Search bar -->
  <g transform="translate(850, 130)" opacity="0.5">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="url(#card)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="22" cy="18" r="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="28" y1="24" x2="34" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <rect x="45" y="14" width="80" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  </g>

  <!-- Code snippet -->
  <g transform="translate(150, 300)" opacity="0.5">
    <rect x="0" y="0" width="120" height="80" rx="6" fill="url(#card)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="10" y="22" fill="#14b8a6" font-family="monospace" font-size="10">const</text>
    <text x="40" y="22" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="10">docs</text>
    <text x="10" y="38" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10">  .search()</text>
    <text x="10" y="54" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10">  .filter()</text>
    <text x="10" y="70" fill="#f97316" font-family="monospace" font-size="10">  .render()</text>
  </g>

  <!-- Lightbulb (aha moment) -->
  <g transform="translate(600, 80)">
    <ellipse cx="0" cy="0" rx="25" ry="30" fill="#fbbf24" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#fbbf24" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="10" ry="12" fill="#fef3c7"/>
    <!-- Rays -->
    <g stroke="#fbbf24" stroke-width="2" opacity="0.4">
      <line x1="0" y1="-45" x2="0" y2="-55"/>
      <line x1="35" y1="-25" x2="45" y2="-35"/>
      <line x1="-35" y1="-25" x2="-45" y2="-35"/>
      <line x1="45" y1="10" x2="55" y2="10"/>
      <line x1="-45" y1="10" x2="-55" y2="10"/>
    </g>
  </g>

  <!-- Human figures climbing -->
  <g transform="translate(350, 350)" opacity="0.5">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="0" cy="-4" r="4" fill="#14b8a6" opacity="0.6"/>
    <path d="M-6 8 Q0 14 6 8" stroke="#14b8a6" stroke-width="1.5" fill="none"/>
  </g>
  <g transform="translate(420, 320)" opacity="0.4">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="0" cy="-3" r="3" fill="#14b8a6" opacity="0.6"/>
    <path d="M-5 6 Q0 11 5 6" stroke="#14b8a6" stroke-width="1.5" fill="none"/>
  </g>
  <g transform="translate(780, 340)" opacity="0.5">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="0" cy="-5" r="5" fill="#14b8a6" opacity="0.6"/>
    <path d="M-7 9 Q0 16 7 9" stroke="#14b8a6" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Stats bubbles -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1"/>
    <text x="65" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="16" font-weight="bold">-50%</text>
    <text x="65" y="42" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">SUPPORT TICKETS</text>
  </g>
  <g transform="translate(970, 100)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="rgba(20,184,166,0.2)" stroke="#14b8a6" stroke-width="1"/>
    <text x="65" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="16" font-weight="bold">91%</text>
    <text x="65" y="42" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">PREFER SELF-SERVICE</text>
  </g>

  <!-- Title text -->
  <text x="600" y="480" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600">
    Why Your SaaS Docs Are Costing You
  </text>
  <text x="600" y="530" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Inter, system-ui, sans-serif" font-size="20">
    Build documentation that reduces tickets and drives retention
  </text>

  <!-- GuardBot branding -->
  <text x="600" y="590" text-anchor="middle" fill="#dc3545" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">
    GUARDBOT
  </text>
</svg>
