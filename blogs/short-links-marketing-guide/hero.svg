<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#1a1d21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc3545"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="link" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545"/>
      <stop offset="100%" style="stop-color:#a02030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Chain link icon (left) -->
  <g transform="translate(350, 220)">
    <!-- Link 1 -->
    <ellipse cx="0" cy="0" rx="50" ry="30" fill="none" stroke="url(#link)" stroke-width="12" transform="rotate(-45)"/>
    <!-- Link 2 -->
    <ellipse cx="60" cy="60" rx="50" ry="30" fill="none" stroke="url(#link)" stroke-width="12" transform="rotate(-45)"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(520, 280)">
    <path d="M0 0 L80 0" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-dasharray="10,5"/>
    <path d="M80 0 L65 -12 M80 0 L65 12" stroke="rgba(255,255,255,0.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Shield icon (right/center) -->
  <g transform="translate(680, 180)">
    <path d="M80 0 L160 30 L160 90 C160 140 120 180 80 200 C40 180 0 140 0 90 L0 30 Z"
          fill="url(#shield)" opacity="0.9"/>
    <path d="M50 100 L70 120 L120 70"
          stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Bot icons being blocked -->
  <g transform="translate(180, 200)" opacity="0.4">
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="none" stroke="#dc3545" stroke-width="2"/>
    <circle cx="-8" cy="-5" r="5" fill="#dc3545"/>
    <circle cx="8" cy="-5" r="5" fill="#dc3545"/>
    <rect x="-10" y="5" width="20" height="4" rx="2" fill="#dc3545"/>
  </g>
  <g transform="translate(250, 320)" opacity="0.35">
    <rect x="-18" y="-18" width="36" height="36" rx="6" fill="none" stroke="#dc3545" stroke-width="2"/>
    <circle cx="-6" cy="-4" r="4" fill="#dc3545"/>
    <circle cx="6" cy="-4" r="4" fill="#dc3545"/>
    <rect x="-8" y="4" width="16" height="3" rx="1.5" fill="#dc3545"/>
  </g>
  <g transform="translate(150, 350)" opacity="0.3">
    <rect x="-15" y="-15" width="30" height="30" rx="5" fill="none" stroke="#dc3545" stroke-width="2"/>
    <circle cx="-5" cy="-3" r="3" fill="#dc3545"/>
    <circle cx="5" cy="-3" r="3" fill="#dc3545"/>
    <rect x="-6" y="3" width="12" height="2.5" rx="1" fill="#dc3545"/>
  </g>

  <!-- Human icons passing through -->
  <g transform="translate(950, 220)" opacity="0.6">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="-8" r="10" fill="#22c55e" opacity="0.5"/>
    <path d="M-12 15 Q0 25 12 15" stroke="#22c55e" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(1020, 300)" opacity="0.5">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="-6" r="8" fill="#22c55e" opacity="0.5"/>
    <path d="M-10 12 Q0 20 10 12" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(980, 380)" opacity="0.4">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="-5" r="6" fill="#22c55e" opacity="0.5"/>
    <path d="M-8 10 Q0 16 8 10" stroke="#22c55e" stroke-width="2" fill="none"/>
  </g>

  <!-- Stats bubbles -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="rgba(220,53,69,0.2)" stroke="#dc3545" stroke-width="1"/>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="18" font-weight="bold">51%</text>
    <text x="60" y="42" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">BOT TRAFFIC</text>
  </g>
  <g transform="translate(980, 120)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1"/>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="18" font-weight="bold">$63B</text>
    <text x="60" y="42" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">LOST TO FRAUD</text>
  </g>

  <!-- Title text -->
  <text x="600" y="480" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600">
    The Complete Guide to Short Links
  </text>
  <text x="600" y="530" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Inter, system-ui, sans-serif" font-size="20">
    Protect your marketing campaigns from bot traffic
  </text>

  <!-- GuardBot branding -->
  <text x="600" y="590" text-anchor="middle" fill="#dc3545" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">
    GUARDBOT
  </text>
</svg>
