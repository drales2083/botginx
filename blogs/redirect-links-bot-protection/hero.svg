<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#1a1d21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc3545"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545"/>
      <stop offset="100%" style="stop-color:#a02030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Shield icon (centered) -->
  <g transform="translate(520, 180)">
    <!-- Shield shape -->
    <path d="M80 0 L160 30 L160 90 C160 140 120 180 80 200 C40 180 0 140 0 90 L0 30 Z"
          fill="url(#shield)" opacity="0.9"/>
    <!-- Checkmark -->
    <path d="M50 100 L70 120 L120 70"
          stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Bot icons being blocked (left side) -->
  <g transform="translate(180, 250)" opacity="0.4">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#dc3545" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="#dc3545" opacity="0.3"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-family="monospace" font-size="24">X</text>
  </g>
  <g transform="translate(280, 180)" opacity="0.3">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#dc3545" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#dc3545" opacity="0.3"/>
    <text x="0" y="6" text-anchor="middle" fill="white" font-family="monospace" font-size="20">X</text>
  </g>
  <g transform="translate(220, 350)" opacity="0.35">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#dc3545" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#dc3545" opacity="0.3"/>
    <text x="0" y="6" text-anchor="middle" fill="white" font-family="monospace" font-size="18">X</text>
  </g>

  <!-- Human icons passing through (right side) -->
  <g transform="translate(920, 240)" opacity="0.6">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="-8" r="10" fill="#22c55e" opacity="0.5"/>
    <path d="M-12 15 Q0 25 12 15" stroke="#22c55e" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(1000, 320)" opacity="0.5">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="-6" r="8" fill="#22c55e" opacity="0.5"/>
    <path d="M-10 12 Q0 20 10 12" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(950, 180)" opacity="0.4">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="-5" r="6" fill="#22c55e" opacity="0.5"/>
    <path d="M-8 10 Q0 16 8 10" stroke="#22c55e" stroke-width="2" fill="none"/>
  </g>

  <!-- Connection lines -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="5,5">
    <line x1="320" y1="280" x2="520" y2="280"/>
    <line x1="680" y1="280" x2="880" y2="280"/>
  </g>

  <!-- Arrow pointing right (allowed traffic) -->
  <g transform="translate(780, 280)">
    <path d="M0 0 L40 0 L30 -10 M40 0 L30 10" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- X blocking (blocked traffic) -->
  <g transform="translate(400, 280)">
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#dc3545" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="-15" x2="-15" y2="15" stroke="#dc3545" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title text -->
  <text x="600" y="480" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600">
    Redirect Links with Bot Protection
  </text>
  <text x="600" y="530" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Inter, system-ui, sans-serif" font-size="20">
    Block bots. Let humans through. Protect your campaigns.
  </text>

  <!-- GuardBot branding -->
  <text x="600" y="590" text-anchor="middle" fill="#dc3545" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">
    GUARDBOT
  </text>
</svg>
