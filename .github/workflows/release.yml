name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name }}"
          PKG="github.com/botginx/botginx/pkg/buildinfo"
          go build -ldflags="-s -w -X ${PKG}.version=${VERSION}" \
            -o botginx-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: botginx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: botginx-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          mv artifacts/botginx-linux-amd64/botginx-linux-amd64 release/
          mv artifacts/botginx-linux-arm64/botginx-linux-arm64 release/
          cd release
          sha256sum botginx-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/botginx-linux-amd64
            release/botginx-linux-arm64
            release/SHA256SUMS
          generate_release_notes: true

  cleanup:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Delete old caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old caches..."
          gh api repos/${{ github.repository }}/actions/caches \
            --paginate -q '.actions_caches[].id' | \
            xargs -I{} gh api -X DELETE repos/${{ github.repository }}/actions/caches/{} || true
          echo "Cache cleanup complete"

      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            botginx-linux-amd64
            botginx-linux-arm64
          failOnError: false
