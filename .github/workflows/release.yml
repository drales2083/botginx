name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

env:
  KEEP_RELEASES: 10
  KEEP_RUNS: 20

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ALL caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Deleting all caches..."
          gh api repos/${{ github.repository }}/actions/caches \
            --paginate -q '.actions_caches[].id' 2>/dev/null | \
            xargs -I{} gh api -X DELETE repos/${{ github.repository }}/actions/caches/{} 2>/dev/null || true
          echo "✅ Caches cleared"

      - name: Delete ALL artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Deleting all artifacts..."
          gh api repos/${{ github.repository }}/actions/artifacts \
            --paginate -q '.artifacts[].id' 2>/dev/null | \
            xargs -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{} 2>/dev/null || true
          echo "✅ Artifacts cleared"

      - name: Delete old releases (keep last ${{ env.KEEP_RELEASES }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Cleaning old releases (keeping last $KEEP_RELEASES)..."

          # Get total count
          total=$(gh release list --limit 1000 | wc -l)
          echo "Total releases: $total"

          if [ "$total" -gt "$KEEP_RELEASES" ]; then
            to_delete=$((total - KEEP_RELEASES))
            echo "Deleting $to_delete old releases..."

            # Delete oldest releases (gh release list returns newest first)
            gh release list --limit 1000 | tail -n "$to_delete" | cut -f1 | \
              while read tag; do
                echo "  Deleting: $tag"
                gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
              done
          else
            echo "Nothing to delete (have $total, keep $KEEP_RELEASES)"
          fi

          echo "✅ Old releases cleaned"

      - name: Delete old workflow runs (keep last ${{ env.KEEP_RUNS }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Cleaning old workflow runs (keeping last $KEEP_RUNS)..."

          # Get workflow runs older than the keep limit
          gh api repos/${{ github.repository }}/actions/runs \
            --paginate -q '.workflow_runs[].id' 2>/dev/null | \
            tail -n +$((KEEP_RUNS + 1)) | \
            xargs -I{} gh api -X DELETE repos/${{ github.repository }}/actions/runs/{} 2>/dev/null || true

          echo "✅ Old workflow runs cleaned"

      - name: Delete draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Deleting draft releases..."
          gh api repos/${{ github.repository }}/releases \
            --paginate -q '.[] | select(.draft==true) | .id' 2>/dev/null | \
            xargs -I{} gh api -X DELETE repos/${{ github.repository }}/releases/{} 2>/dev/null || true
          echo "✅ Draft releases cleaned"

  build:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build binaries
        run: |
          VERSION="${{ github.ref_name }}"
          PKG="github.com/botginx/botginx/pkg/buildinfo"

          mkdir -p release

          # Build amd64
          echo "Building linux/amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X ${PKG}.version=${VERSION}" \
            -o release/botginx-linux-amd64 ./cmd/server

          # Build arm64
          echo "Building linux/arm64..."
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X ${PKG}.version=${VERSION}" \
            -o release/botginx-linux-arm64 ./cmd/server

          # Checksums
          cd release
          sha256sum botginx-* > SHA256SUMS
          echo "📦 Build complete:"
          ls -la
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/botginx-linux-amd64
            release/botginx-linux-arm64
            release/SHA256SUMS
          generate_release_notes: true
