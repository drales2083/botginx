{{define "content"}}
<style>
  .error-page {
    margin: 4rem auto;
    max-width: 640px;
    width: 100%;
  }
  .error-page .headline {
    float: left;
    font-size: 6rem;
    font-weight: 300;
    line-height: 1;
  }
  .error-page .error-content {
    margin-left: 12rem;
  }
  .error-page .error-content h3 {
    font-size: 1.5rem;
    font-weight: 400;
  }
  @media (max-width: 575.98px) {
    .error-page .headline {
      float: none;
      text-align: center;
      width: 100%;
    }
    .error-page .error-content {
      margin-left: 0;
      text-align: center;
    }
  }
</style>

<div class="error-page">
  <h2 class="headline text-danger">404</h2>

  <div class="error-content">
    <h3>
      <i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>
      Oops! Page not found.
    </h3>

    <p class="text-muted">
      We could not find the page you were looking for.
      Meanwhile, you may return to the dashboard or use the menu to find your way.
    </p>

    <div class="d-flex gap-2 flex-wrap">
      <a href="/user/dashboard" class="btn btn-primary">
        <i class="bi bi-house me-1"></i> {{t "dashboard"}}
      </a>
      <button class="btn btn-outline-secondary" onclick="history.back()">
        <i class="bi bi-arrow-left me-1"></i> Go back
      </button>
    </div>
  </div>
</div>
{{end}}
