{{define "auth"}}
<!doctype html>
<html lang="{{currentLang}}" data-bs-theme="dark" data-lte-primary="danger">
<head>
  <meta charset="utf-8" />
  <title>{{.Title}} | {{appName}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <!-- Preconnect and preload for faster icon loading -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/fonts/bootstrap-icons.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/css/adminlte.css" />
  <link rel="stylesheet" href="/static/css/adminlte-colors.css" />
  <style>
    /* Matches the 20% text scale in the main layout. */
    :root {
      font-size: 120%;
    }
    .login-page, .register-page {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box, .register-box {
      /* Widened alongside the 20% text scale so the form does not feel cramped. */
      width: 460px;
      max-width: 95%;
    }
    .login-logo, .register-logo {
      font-size: 2.1rem;
      font-weight: 300;
      margin-bottom: 1rem;
      text-align: center;
    }
    .login-logo a, .register-logo a {
      color: #DC3545;
      text-decoration: none;
    }
    .login-logo b, .register-logo b {
      font-weight: 600;
      color: #DC3545;
    }
  </style>
</head>
<body class="{{if eq .Title "Sign Up"}}register-page{{else}}login-page{{end}} bg-body-tertiary">

  <div class="{{if eq .Title "Sign Up"}}register-box{{else}}login-box{{end}}">
    <div class="{{if eq .Title "Sign Up"}}register-logo{{else}}login-logo{{end}}">
      <a href="/"><img src="/static/img/logo.svg" alt="{{appName}}" style="height: 48px;"></a>
    </div>

    <div class="card">
      <div class="card-body {{if eq .Title "Sign Up"}}register-card-body{{else}}login-card-body{{end}}">
        {{template "auth-content" .}}
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
{{end}}
