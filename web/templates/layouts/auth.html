{{define "auth"}}
<!doctype html>
<html lang="{{currentLang}}" data-bs-theme="dark" data-lte-primary="danger">
<head>
  <meta charset="utf-8" />
  <title>{{.Title}} | {{appName}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="57x57" href="/static/favicon/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/static/favicon/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/static/favicon/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/static/favicon/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/static/favicon/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/static/favicon/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/static/favicon/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/favicon/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/static/favicon/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
  <link rel="manifest" href="/static/favicon/manifest.json">
  <meta name="msapplication-TileColor" content="#dc3545">
  <meta name="msapplication-TileImage" content="/static/favicon/ms-icon-144x144.png">
  <meta name="theme-color" content="#dc3545">
  <!-- Preconnect to CDN -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/css/adminlte.css" />
  <link rel="stylesheet" href="/static/css/adminlte-colors.css" />
  <style>
    /* Matches the 20% text scale in the main layout. */
    :root {
      font-size: 120%;
    }
    .login-page, .register-page {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box, .register-box {
      /* Widened alongside the 20% text scale so the form does not feel cramped. */
      width: 460px;
      max-width: 95%;
    }
    .login-logo, .register-logo {
      font-size: 2.1rem;
      font-weight: 300;
      margin-bottom: 1rem;
      text-align: center;
    }
    .login-logo a, .register-logo a {
      color: #DC3545;
      text-decoration: none;
    }
    .login-logo b, .register-logo b {
      font-weight: 600;
      color: #DC3545;
    }
  </style>
</head>
<body class="{{if eq .Title "Sign Up"}}register-page{{else}}login-page{{end}} bg-body-tertiary">

  <div class="{{if eq .Title "Sign Up"}}register-box{{else}}login-box{{end}}">
    <div class="{{if eq .Title "Sign Up"}}register-logo{{else}}login-logo{{end}}">
      <a href="/"><img src="/static/img/logo.svg" alt="{{appName}}" style="height: 48px;"></a>
    </div>

    <div class="card">
      <div class="card-body {{if eq .Title "Sign Up"}}register-card-body{{else}}login-card-body{{end}}">
        {{template "auth-content" .}}
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
{{end}}
